name: Feature or improvement
description: Propose a feature, case, device or teaching improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve
      description: Who it helps (student, resident, fellow) and in which situation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Related spec or milestone
      placeholder: spec 07 §3, milestone M3
