name: Bug report
description: Something in the simulator or the tooling does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Case and phantom, devices, and the inputs you gave.
      placeholder: |
        1. Open the sandbox with phantom C
        2. Advance the wire 60 mm
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 6477004
  - type: input
    id: environment
    attributes:
      label: Browser, operating system and controller
      placeholder: Chrome 140 on macOS 26, Xbox controller
  - type: textarea
    id: logs
    attributes:
      label: Console output, screenshots or test output
      render: text
